<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIXED PRACTICE QUESTIONS (All Topics Combined)</title>
</head>
<body>
    <script>
        //Variables + Output
        const name = "Aman";
        let age = 22;
        let city = "Kolkata";

        console.log("My name is ", name);
        console.log("I am", age ,"year old");
        console.log("I live in", city);

        // Addition
        // Subtraction
        // Multiplication
        // Division

        let num1 = 20;
        let num2 = 5;

        console.log("Addition:", num1 + num2);
        console.log("Subtraction:", num1 - num2);
        console.log("Multiplication:", num1 * num2);
        console.log("Division:", num1 / num2);

        //Data Types

        let contry = "London";
        let age1 = 25;
        let isStudent = true;

        console.log(typeof contry); // string
        console.log(typeof age1); // number
        console.log(typeof isStudent); // boolean
    </script>
</body>
</html>
