<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision Challenge (Day 1 to Day 4)</title>
</head>
<body>
    <script>
         // Q1 Personal Info
        // Create variables:

        const name = "Aman";
        let age = 22;
        let city = "Kolkata";

        console.log("My name is", name);
        console.log("I am", age, "years old");
        console.log("I live in", city);

        // Q2 Calculator

        let num1 = 50;
        let num2 = 10;

        console.log("Addition:", num1 + num2);
        console.log("Subtraction:", num1 - num2);
        console.log("Multiplication:", num1 * num2);
        console.log("Division:", num1 / num2);

        // Change Value

        let score = 20;

        console.log(20 + 30);

        
        // Day 2 (Data Types + Comparison)
        // Q4 typeof

        let countrie = "London";
        let value = 100;
        let isStudent = true;

        console.log(typeof countrie);
        console.log(typeof value);
        console.log(typeof isStudent);

        // Q5 Boolean Result

       let sum1= 10 > 5;
       let sum2= 8 < 3;
       let sum3 = 20 === 20;
       let sum4 = 7 !== 7

       console.log(sum1);
       console.log(sum2);
       console.log(sum3);
       console.log(sum4);

       //    Q6 Real Check

        let age1 = 22;

        console.log(age1 > 18);

        // PART C — Day 3 (if else)
        // Q7 Age Checker

        let age2 = 16;

        if(age2 >= 18){
            console.log("You are Adult");
        }
        else{
            console.log("You are Minor");
        } 

        // Q8 Positive Negative Zero

        let num = 0;
        if(num > 0){
            console.log("Positive");
        }
        else if(num < 0){
            console.log("Negative");
        }
        else{
            console.log("Zero");
        }

        // Q9 Grade System
        // Q10 Invalid Marks

        let marks = 85;

        if(marks < 0 || marks > 100){
            console.log("Invalid Marks");
        }
        else if(marks >= 90){
            console.log("Grade A");
        }
        else if(marks >= 80){
            console.log("Grade B");
        }
        else if(marks >= 70){
            console.log("Grade C");
        }
        else if(marks >= 60){
            console.log("Grade D");
        }
        else{
            console.log("Fail");
        }

        // PART D — AND &&
        // Q11 Club Entry

        let age6 = 20;
        let hasID = true;

        if(age6 && hasID){
            console.log("You can enter the club");
        }
        else{
            console.log("You cannot enter the club");
        }
    </script>
</body>
</html>
