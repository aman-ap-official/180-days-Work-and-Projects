    <script>
         // Q1 Personal Info
        // Create variables:

        const name = "Aman";
        let age = 22;
        let city = "Kolkata";

        console.log("My name is", name);
        console.log("I am", age, "years old");
        console.log("I live in", city);

        // Q2 Calculator

        let num1 = 50;
        let num2 = 10;

        console.log("Addition:", num1 + num2);
        console.log("Subtraction:", num1 - num2);
        console.log("Multiplication:", num1 * num2);
        console.log("Division:", num1 / num2);

        // Change Value

        let score = 20;

        // Day 2 (Data Types + Comparison)
        // Q4 typeof

        let countrie = "London";
        let value = 100;
        let isStudent = true;

        console.log(typeof countrie);
        console.log(typeof value);
        console.log(typeof isStudent);

        // Q5 Boolean Result

       let sum1= 10 > 5;
       let sum2= 8 < 3;
       let sum3 = 20 === 20;
       let sum4 = 7 !== 7

       console.log(sum1);
       console.log(sum2);
       console.log(sum3);
       console.log(sum4);
